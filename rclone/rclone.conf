# rclone 설정 파일
# rcd (rclone remote control) 모드로 실행되어 API 형식으로 동작
# copy 모드로 증분 복제 수행

[s3]
type = s3
provider = AWS
env_auth = false
access_key_id = ${AWS_ACCESS_KEY_ID}
secret_access_key = ${AWS_SECRET_ACCESS_KEY}
region = ap-northeast-2
location_constraint = ap-northeast-2
acl = private
server_side_encryption = AES256
storage_class = STANDARD

# rcd 설정 (rclone remote control)
# rclone rcd --rc-addr :5572 --rc-user admin --rc-pass rclone123 --rc-allow-origin "*"
# API 엔드포인트: http://localhost:5572

# 복제 작업 설정
# 소스: 로컬 데이터 디렉토리
# 대상: S3 버킷 (databricks-test-lhk)
# 모드: copy (증분 복제 - 변경된 파일만 복사)
# 트리거: chk 파일 확인 후 복제 시작

[local]
type = local

# 복제 작업 정의
# rclone copy local:data s3:databricks-test-lhk --include "*.chk" --include "*.parquet" --update --verbose
# chk 파일이 확인된 이후 복제 진행
